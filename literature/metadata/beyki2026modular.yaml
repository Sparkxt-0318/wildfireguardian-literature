one_line_difference: >
  The first wildfire evacuation model we could verify that explicitly simulates INBOUND rescue traffic and emergency extraction simultaneously with outbound self-evacuation on a fire-degraded network — it occupies the simultaneity, but the reported output is simulated evacuation time validated against a drill, not a latest-safe-dispatch deadline.
