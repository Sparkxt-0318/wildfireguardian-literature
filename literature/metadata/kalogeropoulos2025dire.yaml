one_line_difference: >
  Treats BOTH wildfire spread and evacuation time as probabilistic variables and outputs an 'evacuation safety factor' in [0,1] — a scalar decision-relevant probability of mission failure — which is structurally the same kind of output WG-C-003 wants, but computed for community egress rather than a responder round trip.
