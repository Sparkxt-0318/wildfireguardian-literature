one_line_difference: >
  Last-mile, short-notice bushfire evacuation of late evacuees by capacitated vehicles under HARD TIME WINDOWS and route disruption, robustly optimised, on Black Saturday data — the oldest and strongest occupation of 'fetch people before the fire arrives', still with no fire-spread-derived deadline as the reported quantity.
