one_line_difference: >
  Peer-reviewed characterisation of the Korean KFDRS against NFDRS/CFFDRS/EFFIS/AFDRS,
  documenting that KFDRS is daily, district-resolution, empirical and weather-driven with
  no live-fuel-moisture model. This is a citable, independent statement of a Korean
  operational limitation — useful raw material for a §4(b) argument.
