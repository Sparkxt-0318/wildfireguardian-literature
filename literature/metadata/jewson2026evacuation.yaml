one_line_difference: >
  Jewson poses the RQ1 decision structure in its purest published form - evacuate
  now or wait for the next forecast, solved by a cost-loss model - and sweeps a
  NAMED forecast-uncertainty dimension (the standard deviation of the change in
  forecast probability between updates) to find the value at which the
  recommendation flips from evacuate to wait; the hazard is a tropical cyclone,
  the model is explicitly idealized with no landscape, no comparator policy, no
  observation-to-product latency, no responder and no assisted evacuation, and
  the frontier is one-dimensional in forecast uncertainty rather than a set in
  error x latency space.
