dbd_scoring:
  scored_on: 2026-09-20
  scored_by: "Agent C - Verification Auditor"
  scored_against: "this paper only, at METHODS_VERIFIED / E4"
  overall_label: MATHEMATICALLY_IMPLICIT
  overall_label_basis: >
    The latest feasible dispatch time is obtainable from the formulation by parametric re-solving over
    a shifted time origin, but it is never extracted, reported, plotted, varied or named. The strings
    "latest", "deadline" and "dispatch time" do not occur in the body; "dispatch" occurs twice and
    both times means a location. Dispatch is an assumption here (t = 0), not a result. A constraint
    that bounds arrival times is not a reported latest dispatch time.
  WG-DBD-1:
    component: "Complete assisted mission = responder ingress + service + egress"
    score: OCCUPIED
    evidence: >
      Base is the medical facility a vehicle is stationed at (section 3; constraints (7)-(8); Table 3
      stop 1 = H5). Ingress to an assembly area, explicit loading dwell c^v_l and unloading dwell
      d^v_m (section 3), delivery to hospital or shelter. All legs timed by the arrival recursion
      (29)/(30), Model 2 (54)/(55), and gated by (53) regardless of direction. Caveat - the pickup
      node is a temporary assembly area, not a residence (section 1), and the door-to-door leg is
      outside the model.
  WG-DBD-2:
    component: "Fire-relative feasible dispatch times computed"
    score: NOT_OCCUPIED
    evidence: >
      Dispatch is the constant zero, imposed by constraint (26) in Model 1 and (50) in Model 2 -
      "arrival times start at 0". No release, departure, delay or waiting variable exists. Nothing in
      the paper computes a time at which to begin.
  WG-DBD-3:
    component: "Latest feasible dispatch instant reported as an operational quantity"
    score: NOT_OCCUPIED
    evidence: >
      Absent from the body. Every reported output is a plan (fleet size, shelter set, routes) or a
      forward COMPLETION time - Table 7's "Evacuation time for given % of the population [min]" at
      50/70/100 per cent, and Table 3's per-stop arrival times. Sensitivity analyses cover shelter
      count, fire origin, population, priority mix and window length, never dispatch or start time.
  WG-DBD-4:
    component: "Non-monotone feasible dispatch windows as a SET, not a single deadline"
    score: NOT_OCCUPIED
    evidence: >
      One closure instant per node and per arc, permanent - "after which it cannot be visited"
      (section 3), "becomes completely unavailable" (section 5.4). Strictly monotone, nothing
      reopens. The soft window STR^s_ll' is a one-way step raising travel time by y per cent from
      that instant on (constraints (56)-(57)), not a second interval. No set-valued feasibility
      object exists anywhere in the paper.
  WG-DBD-5:
    component: "Full traversal-interval hazard evaluated (vs hazard checked only at arc entry)"
    score: NOT_OCCUPIED
    evidence: >
      Constraint (53) bounds the arrival time at l, the ORIGIN of arc (l, l') - i.e. the moment of
      arc entry - against that arc's hard window. The soft-disruption trigger (56) is built the same
      way and the authors state it in words before (56). Nothing constrains arrival at l' or the arc
      state during traversal, so a vehicle entering one minute before closure completes the
      traversal unharmed however long it takes - up to 38.6 km in Table 5's distance matrix.
  WG-DBD-6:
    component: "Feasibility conditioned on decision-time information rather than oracle future knowledge"
    score: NOT_OCCUPIED
    evidence: >
      Every second-stage variable is indexed by scenario s and optimized knowing that scenario's
      realized TW^s_l, STR^s_ll' and TWR^s_ll' - i.e. knowing exactly when the fire reaches every node
      and arc. No filtration, no rolling horizon, no re-planning on observation, no forecast. NUANCE
      RECORDED - the first-stage fleet-sizing and shelter-activation decision IS non-anticipative, but
      mission feasibility is a second-stage question and that stage has oracle knowledge.
  WG-DBD-7:
    component: "Korean rural wildfire geometry"
    score: NOT_OCCUPIED
    evidence: >
      Roxborough Park, Colorado, USA - a WUI community of about 900 homes and 9,057 people, on Google
      Maps distances from January 2025 (section 6.5.1, Table 5). Canada, USA and Australia framing
      throughout section 1. Korea does not appear in the paper.
  kills_dispatch_by_deadline_claim: ONLY_PARTLY
  kills_note: >
    Takes WG-DBD-1 outright - the sentence "nobody models the assisted-evacuation round trip as one
    timed mission" is now forbidden. Leaves WG-DBD-2 through WG-DBD-7 standing, six of seven.

time_window_distribution_verified:
  claim_checked: "previous agent reported Uniform(400, 850) minutes with a categorical fire-origin label"
  verdict: CONFIRMED_AND_EXTENDED
  exact_text: "Time windows for assembly areas [min] Uniform(400, 850) / Time windows for routes [min] Uniform(400, 850) / Fire origin Random(south,west, north)"
  location: "Table 6, section 6.5.1"
  correction: >
    The previous record was correct but incomplete in a way that matters. BOTH the assembly-area
    windows and the ROUTE windows are drawn from Uniform(400, 850), and the fire origin is drawn
    INDEPENDENTLY as Random(south, west, north) - nothing in the sampling makes a southern node's
    window depend on a southern ignition. Section 3's causal sentence, "Depending on the origin of the
    fire, wind direction, and vegetation density, each assembly area l is subject to a time window",
    is asserted and never operationalised. The apparent coupling in section 6.5.2 ("in category 32 the
    fire originates in the south, allowing more time to evacuate northern assembly areas") is post-hoc
    narrative read onto categories whose parameters were drawn independently. Separately, the 10,000
    sampled scenarios are collapsed to 54 categories by AVERAGING, which destroys the distribution
    tails where a timing deadline would live.

