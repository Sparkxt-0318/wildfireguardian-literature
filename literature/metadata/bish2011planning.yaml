one_line_difference: >
  The canonical bus-based-evacuation formulation for carless populations. Note the design feature closest to WG-C-003:
  the last pickup at each location is required to occur by a location-specific, risk-determined time -- an exogenous
  location deadline, not one derived from a modelled hazard, and applied to the pickup instant rather than to dispatch.
