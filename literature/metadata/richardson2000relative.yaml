one_line_difference: >
  Owns the relative-economic-value (REV) curve as a function of cost-loss
  ratio and lead time for ensemble forecasts; the 'region of the C/L axis
  where the forecast has value' IS a forecast-value boundary, but in weather-
  variable space, with climatology as the reference, not a tuned spatial
  trigger buffer.
