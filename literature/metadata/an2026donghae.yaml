one_line_difference: >
  Measures OBSERVED Korean evacuation response time and movement intensity by population
  group after a real disaster text message (2022 Donghae fire), finding older adults had
  the lowest movement intensity; it measures behaviour, it does not compute any deadline.
  Its finding is the strongest empirical Korean support for the premise behind WG-C-005.
