one_line_difference: >
  Chang et al. show that ALERT LATENCY and mobility constraints jointly determine who gets out -- the nearest published
  treatment of latency as a decision-relevant variable in wildfire evacuation -- but for self-evacuating households, with no
  responder, no pickup, and no deadline. This is the closest existing work to WG-C-012's spirit inside Category 9.
