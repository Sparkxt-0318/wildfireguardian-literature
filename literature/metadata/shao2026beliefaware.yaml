one_line_difference: >
  Wildfire active sensing: schedules sensing/representation/transmission under
  a sparse downlink so the receiver can predict an H-step-ahead hazard map;
  the objective is PREDICTIVE loss on the hazard map, not a protective-action
  decision loss, and the evaluation is a physics-calibrated synthetic
  environment with no evacuation decision.
