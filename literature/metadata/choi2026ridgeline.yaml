one_line_difference: >
  Establishes a Korea-specific observational benchmark (fire perimeters are ridge-proximal
  AND ridge-aligned, mean enrichment 2.3 vs 1.5 for proximity alone) against which a
  fire-spread model must be judged in Korea. This is the single best candidate evidence
  for a NOVELTY_STANDARD §4(a)/(b) argument, because it gives a documented Korean terrain
  signal that a spread model can be shown to reproduce or miss.
