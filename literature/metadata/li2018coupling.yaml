one_line_difference: >
  Replaces expert-judgement evacuation time with a TRAFFIC SIMULATION, derives a cumulative probability distribution over clearance times, and emits probability-indexed trigger buffers (e.g. the 95th-percentile buffer) — this is the single closest prior art to a 'probabilistic, traffic-aware trigger', and it does it for household egress, not responder dispatch.
