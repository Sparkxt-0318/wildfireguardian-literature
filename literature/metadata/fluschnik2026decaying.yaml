one_line_difference: >
  Reports the LATEST FEASIBLE START INSTANT as the computed output quantity for evacuation on a graph "where connections
  become impassable at some point in time" -- "We provide an integer linear program (ILP) to compute the latest possible time
  to evacuate" -- which is WG-DBD-3's quantity in a graph-algorithms venue; but the paths are outbound only, the decay times
  are exogenous inputs rather than a modelled fire, there is no responder, no pickup, no probability index and no forecast.
