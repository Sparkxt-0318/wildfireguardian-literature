one_line_difference: >
  Re-founds the trigger boundary in the fire-safety-engineering tradition (FARSITE + explicit safety factors for uncertainty) and validates on Swinley Forest UK and Roxborough Park USA; the safety factor is a margin, not a probability distribution, and there is no responder leg.
