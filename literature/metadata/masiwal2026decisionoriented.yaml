one_line_difference: >
  Builds a decision-oriented benchmark (miss rate, false alarm rate, skill vs
  climatology, operational runnability) to choose which forecast system to
  deploy; the comparator is climatology, the decision is agricultural
  planting, and operational latency is a selection criterion but is not a
  quantified decision variable.
