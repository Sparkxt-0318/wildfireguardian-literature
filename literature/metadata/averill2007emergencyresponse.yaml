one_line_difference: >
  Building-fire, not wildfire: models first responders moving UP a stairwell against occupants moving down, i.e. the counterflow ingress penalty - the mechanism WG-C-003 needs, established decades ago in a different hazard and at a different scale; it is a government report, NOT peer-reviewed.
