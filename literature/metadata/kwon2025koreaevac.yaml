one_line_difference: >
  Strategic mixed-integer shelter-location and backup-linkage design for a rural
  Korean county using static topographic/environmental wildfire risk indices; it
  does not model fire progression in time, and produces a network plan rather
  than any time-of-day decision, let alone a responder dispatch deadline.
