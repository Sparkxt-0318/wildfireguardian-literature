one_line_difference: >
  Wildfire-smoke domain: evaluates six operational forecasts on two explicit
  DECISION tasks against a strong persistence baseline and finds no forecast
  beats persistence on one task while most beat it on the other; the decision
  is individual exposure avoidance, not evacuation timing, and the baseline is
  persistence rather than a tuned spatial trigger.
