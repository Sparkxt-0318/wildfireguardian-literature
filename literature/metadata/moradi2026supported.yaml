citation_lead_resolved:
  kamyabniya_2022:
    verbatim_reference: "Kamyabniya, A. (2022). Integrated and Coordinated Relief Logistics Planning Under Uncertainty for Relief Logistics Operations. University of Ottawa."
    location: "reference list; cited in section 2 as \"Kamyabniya Kamyabniya (2022)\" (doubled surname is a citation-macro error in the original)"
    type: "doctoral thesis, University of Ottawa - which is why article search never found it"
    evidence_level: E1
    status: "reference-list record only; NOT retrieved. Moradi et al.'s description of it is theirs, not ours, and may not be attributed to the thesis."
    why_still_a_threat: >
      Same institution and group - Saure and Patrick co-author Kamyabniya et al. (2024), so this is
      almost certainly a predecessor thesis under the same supervisors. Moradi et al. section 2
      describe it as a mixed-integer model for supported evacuation jointly optimizing temporary
      shelter locations and vehicle routing, "formulated as a time-step-based two-stage stochastic
      problem". A time-step formulation is the structure most likely to carry a per-step feasibility
      indicator, i.e. the closest thing in this lineage to a dispatch SET. RETRIEVE from uO Research.
    do_not_confuse_with: "Kamyabniya, A., Saure, A., Salman, F. S., Benichou, N., & Patrick, J. (2024). Optimization models for disaster response operations: A literature review. OR Spectrum, 46, 737-783."

one_line_difference: >
  Formulates supported evacuation of people who cannot self-evacuate as a two-stage stochastic
  facility-location + multi-vehicle PDPTW in which BOTH the assembly area and the ROUTE carry a hard
  time window "after which the route is reached by the fire" - so the inbound leg IS fire-constrained;
  but every vehicle's departure is pinned to t=0 by constraints (26)/(50), the windows are drawn from
  Uniform(400,850) minutes independently of the fire-origin label rather than from a fire-spread model,
  the hazard is gated only at arc entry, and the output is a routing/fleet plan plus a forward
  completion time, never a latest-safe-dispatch time.
