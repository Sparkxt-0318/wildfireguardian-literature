one_line_difference: >
  Computes and names WG-DBD-3's quantity in a peer-reviewed OR venue -- "their optimal departure time: the latest time of
  departure for which a chosen on-time arrival probability can be guaranteed" -- on a stochastic time-dependent road network,
  and adds an online version in which the advice is revised from information available while the traveller is still at the
  origin (WG-DBD-6); but the trip is a single one-way commute, the uncertainty is a Markovian incident process rather than a
  spreading hazard, there is no mission to complete, no second leg and no fire.
