one_line_difference: >
  Computes, per location, the false-alarm rate forced by a required miss-
  probability given track-uncertainty-vs-lead-time, i.e. a forecast-quality
  boundary for evacuation ordering; the hazard is a hurricane track, the
  evacuation is an aggregate clearance time, and there is no responder-
  inclusive mission or tuned positional-trigger comparator.
