one_line_difference: >
  States WG-DBD-5 as a definition -- "an edge safety event at departure time t states whether the complete execution of e over
  [t, t + W(e)) is collision-free" -- attaches a SET of valid departure times to every edge (WG-DBD-4), and conditions
  feasibility on statuses "revealed locally during execution" rather than on oracle knowledge (WG-DBD-6); but it is a robot
  navigating a roadmap to a goal, with no round trip, no hazard model, no forecast quality axis and no dispatch quantity.
