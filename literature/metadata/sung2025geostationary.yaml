one_line_difference: >
  Quantifies Korean wildfire OBSERVATION latency (mean 12.9-18.2 min geostationary vs
  210-318 min polar-orbiting; Uiseong detected in 22-36 min vs 93-196 min) but never
  converts latency into decision value. WG-C-012 needs exactly this number as an input and
  must cite it rather than re-derive it.
