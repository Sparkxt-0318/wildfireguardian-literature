one_line_difference: >
  Selects in-situ sensor locations AND trains the forecast model end-to-end to
  minimise downstream evacuation/relocation decision regret, explicitly
  rejecting information-gain placement and average-error training; hazard is
  flood depth, the decision is evacuation/relocation cost, and there is no
  responder dispatch deadline or fire-arrival feasibility constraint.
