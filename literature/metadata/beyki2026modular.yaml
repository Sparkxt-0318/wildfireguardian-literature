dbd_scoring_evidence:
  WG-DBD-1: "PARTIALLY_OCCUPIED, provisional at E2. Ingress and an 'emergency extraction' agent class are asserted by the authors' own deposited abstract and highlights, which are topic-level statements E2 does support. The service (pickup/loading dwell) element is wholly unevidenced, and nothing shows ingress, service and egress are chained into one accounted mission rather than three separate simulated behaviours."
  WG-DBD-2: "NOT_DETERMINED. Nothing at E2. An untraceable secondary description of a per-route 'safe time remaining' would, if ever verified, push this toward PARTIALLY_OCCUPIED for routes, not for dispatch instants."
  WG-DBD-3: "NOT_DETERMINED. The decisive question and the one that could not be answered. Weak negative indicators only: a latest-dispatch quantity is not among the outputs the abstract lists, and none of the 43 references is a routing, scheduling or dispatch-optimisation work. Neither indicator is admissible to score a component."
  WG-DBD-4: "NOT_DETERMINED. No evidence either way. Scored independently: WG-DBD-1 being partially occupied does not touch this. A framework simulating an inbound leg need not represent feasibility as anything, let alone as a non-singleton set. If the unverified 'safe time remaining' lead is confirmed, its min-over-waypoints structure is one scalar per route and would count AGAINST occupancy here."
  WG-DBD-5: "NOT_DETERMINED. The highlight 'Fire-driven road-segment closures dynamically update network availability during the evacuation' establishes that network state is time-varying; it does not establish whether an agent already traversing an edge is re-checked against fire arrival mid-traversal. That distinction is exactly Q-B4 and is invisible at E2."
  WG-DBD-6: "NOT_DETERMINED. Unreadable at E2. Flagged first-order for the next attempt: a coupled fire-evacuation simulator can trivially hand its router the true future fire, and whether the authors gate the router's information is unaddressed in every retrievable record."
  WG-DBD-7: "NOT_OCCUPIED, confirmed. E2 suffices because this is a topic-level fact about the case study, not a method detail. Abstract: 'tested in a case study in Portugal'. Four authors are at Portuguese institutions and one in Cyprus. Korea appears nowhere in the record."

