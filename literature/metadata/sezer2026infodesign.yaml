one_line_difference: >
  Sezer sweeps the PRECISION of the information released to evacuating zones and
  plots expected social cost against it (Experiment 2, Fig. 6), finding that
  precision is self-defeating under a single broadcast and valuable only once
  releases are staggered - i.e. an information-quality axis varied in a
  controlled experiment with DECISION LOSS as the outcome, in hurricane
  evacuation; the quantity varied is the precision of a deliberately designed
  public signal rather than forecast error, there is no assisted evacuation, no
  responder round trip, no observation-to-product latency and no comparator
  trigger policy, and it is a preprint.
key_quotes:
  - quote: "public-signal precision is sign-ambiguous due to an informational Braess effect, where vague advisories are optimal unless complemented by a staggered order"
    locus: "Abstract"
