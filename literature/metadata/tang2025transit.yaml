one_line_difference: >
  Transit vehicles must drive INTO the hazard area to collect carless/transit-dependent evacuees and drive them out, with RL allocating scarce vehicles — structurally the same base-pickup-destination trip as WG-C-003, but the control output is a dispatch POLICY, not a fire-relative latest-dispatch TIME, and fire arrival is not the binding constraint.
