one_line_difference: >
  Formulates supported evacuation of people who cannot self-evacuate as a two-stage stochastic facility-location + multi-vehicle PDPTW in which BOTH the assembly area and the ROUTE carry a hard time window 'after which the route is reached by the fire' — so the inbound leg IS fire-constrained; but the time windows are drawn from Uniform(400,850) minutes rather than from a fire-spread model, and the output is a routing/fleet plan, not a latest-safe-dispatch time.
