one_line_difference: >
  Produces STOCHASTIC trigger boundaries by sampling historic wind/weather/vegetation variability and introduces 'uncertainty rosettes' mapping where the boundary is most sensitive — this is probabilistic trigger design done properly, and it is the paper that makes WG-C-004 unclaimable.
