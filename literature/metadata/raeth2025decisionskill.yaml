one_line_difference: >
  States and demonstrates the general negative result WildfireGuardian wants
  for WG-C-014: forecast-level performance does not reliably translate to
  decision-level performance and model rankings change between similar
  decision tasks; the tasks are frost/heat protection and wind dispatch with
  scalar cost functions, not a spatial fire forecast scored by IoU against an
  evacuation-mission decision.
