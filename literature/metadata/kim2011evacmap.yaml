one_line_difference: >
  The earliest Korean wildfire EVACUATION MAP found: a village-scale map-making algorithm that emits evacuation routes
  "according to the wildfire's progression path and spread", written because "most of those to be evacuated consist of
  disaster-vulnerable people" -- so the Korean wildfire-evacuation-map product, the village unit and the vulnerable-population
  motivation are all occupied since 2011; it produces ROUTES on a map, never a time, never a deadline, and never a responder.
