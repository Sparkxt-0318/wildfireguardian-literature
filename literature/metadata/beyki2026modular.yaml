one_line_difference: >
  The first wildfire evacuation model we could verify that explicitly simulates INBOUND rescue traffic and emergency extraction simultaneously with outbound self-evacuation on a fire-degraded network -- it occupies the simultaneity, but whether it reports any latest-safe-dispatch quantity is UNKNOWN, because the full text could not be retrieved and the abstract lists only simulated evacuation times, drill agreement and scenario analysis as outputs.
