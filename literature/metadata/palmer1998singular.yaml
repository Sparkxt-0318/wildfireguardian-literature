one_line_difference: >
  Founds targeted/adaptive observation: where to observe is chosen by
  sensitivity of a forecast metric, and the correct metric depends on the
  PURPOSE of the observations; the purpose is forecast-error reduction, not a
  downstream protective-action decision, and the domain is synoptic
  meteorology.
