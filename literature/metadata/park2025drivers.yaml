one_line_difference: >
  Regression/ML attribution over 905 Korean fires: each +1 m/s peak wind expands burned
  area by ~8.5 ha and each +1% RH reduces it by ~3 ha, with conifer dominance amplifying
  spread. Korean-specific evidence for why peak gusts, not mean wind, govern Korean lead
  times — an input to a §4(a) argument, not an evacuation study.
