one_line_difference: >
  Couples wildfire simulation to road-network vulnerability so that fire-induced closures degrade the network during the evacuation and can trap agents — the 'network fails under the fire you predicted' mechanism WG-C-003 needs on its inbound leg, but applied only to outbound evacuees.
