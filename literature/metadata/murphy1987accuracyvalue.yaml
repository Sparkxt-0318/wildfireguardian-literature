one_line_difference: >
  Establishes in general terms that forecast accuracy and forecast value are
  not monotonically related in the cost-loss situation; it does so for scalar
  accuracy measures of binary forecasts, not for spatial overlap metrics (IoU)
  of a predicted fire perimeter against an evacuation-mission decision.
