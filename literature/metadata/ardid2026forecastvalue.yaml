fulltext_findings: >
  Decision modelled is agency precautionary deployment (C = A$50,000 vs
  L = A$10 million), against a binary label "a fire occurred within a future
  look-ahead window (2, 5 or 10 days)"; "sub-hourly" is the 30-min input and
  update cadence, not the forecast lead. CORRECTION TO EARLIER E2 RECORD: the
  FBI baseline IS tuned - "The optimal classification threshold for each model
  is selected retrospectively to maximise PEV", with per-region optimal FBI
  thresholds reported, and "all FBI values in this study were recalculated
  directly from observed AWS data". No break-even point, no skill threshold, no
  PEV-versus-cost-loss-ratio sweep and no PEV>0 region: C and L are fixed
  throughout the main text, with only a stability check in Supplementary Text
  S2. The words latency, delay, timeliness, lead time, evacuation, trigger
  boundary, buffer, OSSE, synthetic and perturb are all ABSENT from the body.
  Forecasts are evaluated as-is on "the full, naturally imbalanced held-out
  records"; nothing is perturbed or degraded. Truth is real (about 50 years of
  AWS observations, 126 documented fires from official incident reports), so
  there is no hidden-truth design. No evacuation, responder, pickup or Korean
  content. See literature/reviews/fulltext-ardid2026.md.
