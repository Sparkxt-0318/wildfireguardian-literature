one_line_difference: >
  Makes the timeliness-vs-accuracy trade-off explicit and solves for the
  OPTIMAL LEAD TIME TO TRIGGER ACTION as a function of forecast quality and of
  the operational characteristics (duration/effectiveness) of the action; the
  action is a generic flood preparedness measure, not a responder round trip,
  and 'latency' means forecast lead time, not observation-to-product delay.
