one_line_difference: >
  This is the wildfire instantiation of the cost-loss/PEV pipeline: ML fire-
  potential forecasts evaluated by Potential Economic Value against the Fire
  Behaviour Index; the decision is pre-positioning/fire-potential warning, NOT
  evacuation protective action, and the FBI comparator is an operational
  index, not a buffer/trigger policy tuned on the same scenario distribution.
