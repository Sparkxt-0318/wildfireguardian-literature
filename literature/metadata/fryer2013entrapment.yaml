one_line_difference: >
  Moves the trigger subject from residents to FIREFIGHTERS and varies the evacuation MODE (foot, engine, dozer), which is the closest the classical lineage gets to a responder — but the responder's modelled leg is still one-way egress to a safety zone, never an inbound round trip.
