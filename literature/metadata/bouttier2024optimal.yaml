one_line_difference: >
  Optimises the probability decision threshold per user type AND reports the
  usable-intensity/scale limit beyond which the warning has no skill - i.e. an
  explicit skill boundary with a tuned threshold; the comparator is a
  deterministic control forecast, and the decision is a categorical warning,
  not a protective-action mission.
