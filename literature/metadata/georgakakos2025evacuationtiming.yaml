one_line_difference: >
  Solves 'issue the evacuation statement now vs delay' by Monte Carlo under a
  forecast probability sequence indexed by lead time, forecast uncertainty,
  public-response probability and the evacuation-completion time interval;
  hazard is generic and the completion interval is an exogenous scalar, not a
  modelled responder ingress+pickup+egress round trip against a spatial fire
  field.
