one_line_difference: >
  Mixed-integer goal programming over a dynamic network of unsafe pick-up points and safe shelters/hospitals with heterogeneous vehicles and health-priority classes, case-studied on the 2019 Saddleridge fire — it owns the 'who gets fetched, by which vehicle, to where' question, with no fire-spread model and no deadline output.
