one_line_difference: >
  NIFoS computes an evacuation RANGE (which area must clear) from modelled smoke dispersion
  and ranks warning-evacuation priority; WildfireGuardian computes an evacuation TIME (when a
  responder must depart) from modelled fire-front arrival on both legs of a round trip.
