one_line_difference: >
  MOIS/KFS set two administratively fixed fire-arrival lead times (5 h general, 8 h
  vulnerable) as evacuation triggers from a deterministic spread forecast; WildfireGuardian
  computes a mission-feasibility dispatch deadline from an ensemble arrival-time
  distribution, and treats a fixed lead time like this one as the tuned comparator to beat.
