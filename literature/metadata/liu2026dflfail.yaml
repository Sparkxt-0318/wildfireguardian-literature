one_line_difference: >
  Tutorial stating flatly that improved predictive accuracy does not in
  general translate into improved decision quality, and that uncertainty-
  driven data collection is the wrong criterion in decision-focused settings -
  which pre-empts BOTH the WG-C-014 headline and the WG-C-008 motivation in
  generic form.
