one_line_difference: >
  Robust initial-attack placement of suppression resources against uncertain
  predicted fire behaviour; robustness is over fire-behaviour uncertainty for
  asset positioning, not over whether a named resident remains extractable,
  and the decision is placement, not dispatch timing.
