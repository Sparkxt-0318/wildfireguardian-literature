one_line_difference: >
  Yu et al. model the inbound responder leg under a modelled hazard for exactly the vulnerable sites WildfireGuardian cares
  about, but they check arrival against an externally fixed response-time standard and never model pickup, egress, or a
  latest-dispatch time; the mission ends at arrival.
