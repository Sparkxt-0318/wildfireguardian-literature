one_line_difference: >
  Moradi et al. impose fire-arrival hard time windows on every arc of a base->assembly-area->medical-facility round trip for
  residents who cannot self-evacuate, but those windows are exogenous sampled parameters and the reported output is a routing
  and fleet-sizing plan; WildfireGuardian's proposed output is the latest fire-relative dispatch time itself, derived from a
  modelled future fire and reported as a function of forecast error.
