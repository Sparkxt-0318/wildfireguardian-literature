one_line_difference: >
  This programme outputs inbound suppression-ingress ROUTES alongside resident evacuation
  routes from an AI spread/smoke forecast; WildfireGuardian outputs a latest-safe DISPATCH
  TIME for an assisted-evacuation round trip. Same inbound leg, different decision variable
  — and this is a live Korean government programme, so WG-C-003 must be phrased as a
  quantity claim, never as a "no one does inbound routing in Korea" claim.
