one_line_difference: >
  Defines the object WG-DBD-4 would otherwise claim -- feasibility of a configuration under a moving hazard as a FINITE SET
  of disjoint safe time intervals rather than a single deadline ("each spatial configuration has a timeline, which is just an
  ordered list of intervals, alternating between safe and collision") -- and checks the hazard over the whole motion, not at
  entry ("we generate a successor with the earliest possible arrival time that does not have any collisions along the
  motion"); but it plans EARLIEST arrival for a robot in a warehouse, never a latest departure, and has no hazard model, no
  mission structure and no dispatch decision.
